name: Go
on:
  push: null
concurrency:
  group: ${{ github.workflow }}-${{ (github.event.pull_request && github.event.pull_request.number) ||
    github.ref || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  supportedVersions:
    runs-on: ubuntu-latest
    outputs:
      supported_versions: ${{ steps.matrix.outputs.supported_versions }}
    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - name: Read supported_go_versions.txt
      id: matrix
      run: 'versions=$(cat supported_go_versions.txt)

        matrix="[$(echo "$versions" | sed ''s/\(.*\)/"\1"/'' | paste -s -d,)]"

        echo "supported_versions=$matrix" >> $GITHUB_OUTPUT

        '
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - name: Set up Go ${{ matrix.go_version }}
      uses: actions/setup-go@v5.3.0
      with:
        go-version: ${{ matrix.go_version }}
    - name: Cache Go modules
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: v1-go${{ matrix.go_version }}
    - name: Run tests and check license
      run: make check_license test
      env:
        CI: true
    - name: Run style and unused
      if: ${{ matrix.go_version == '1.22' }}
      run: make style unused
